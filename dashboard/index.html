<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeatShield | India WBGT &amp; Heat-Health Dashboard</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="styles.css?v=5"></head>
<body><header><div class="brand-group"><div class="brand-logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v5"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/></svg></div><div><div class="brand-eyebrow"><span class="pulse-indicator" aria-hidden="true"></span><span class="eyebrow-text">EXTREME HEAT EARLY WARNING</span></div><h1>HeatShield <span class="brand-subtitle">&middot; India WBGT &amp; Heat-Health</span></h1></div></div><div class="header-controls"><div class="live-status"><p id="updated">Preparing live analysis&hellip;</p></div><button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Toggle dark mode" title="Switch color theme"><svg class="sun-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg><svg class="moon-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg><span class="theme-btn-text">Theme</span></button></div></header>
<main><section class="map-panel"><div id="map"></div><div class="map-ui"><label for="citySearch"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> Find a city</label><input id="citySearch" autocomplete="off" placeholder="Mumbai, Delhi, Bengaluru, Pune&hellip;" spellcheck="false"><div id="searchResults"></div></div>
<div class="map-legend"><strong>WBGT (&deg;C) Thermal Stress</strong><div class="gradient"></div><div class="scale"><span>24&deg;</span><span>27.8&deg;</span><span>29.5&deg;</span><span>31.1&deg;</span><span>32.2&deg;+</span></div><div class="risk-labels"><span>LOW</span><span>MODERATE</span><span>HIGH</span><span>VERY HIGH</span><span>EXTREME</span></div></div><p id="fieldStatus" class="map-help"><span class="pulse-indicator" style="width:6px;height:6px"></span> Loading calculated WBGT field&hellip;</p>
<aside id="details" class="details-panel visible" aria-label="Selected city heat-health dashboard"><p class="eyebrow" id="place">SELECT A CITY</p><div id="current" class="current-card"><p>Loading&hellip;</p></div><section class="health-summary" id="healthSummary" aria-live="polite"></section><h2>5-day peak forecast</h2><div id="forecast" class="forecast"></div><section class="recommendation-section"><h2>Recommended actions</h2><div id="recommendations" class="recommendations"></div></section></aside></section></main>
<template id="forecastRow"><article class="forecast-row"><time></time><strong></strong><span></span></article></template><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="health-panel.js?v=2"></script><script src="app.js?v=5"></script><script>
(() => { const place=document.getElementById('place'), summary=document.getElementById('healthSummary'), recs=document.getElementById('recommendations'); let active=''; const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); async function loadHealth(){const city=place.textContent.split(String.fromCharCode(0xC2,0xB7))[0].trim();if(!city||city==='SELECT A CITY'||city.includes('UPDATING')||city===active)return;active=city;summary.innerHTML='<article><span>Health risk</span><strong>Loading&hellip;</strong></article>';recs.innerHTML='<p class="empty">Loading recommended actions&hellip;</p>';try{const q='?city='+encodeURIComponent(city);const [riskResponse,recsResponse]=await Promise.all([fetch('/api/heat-risk'+q),fetch('/api/recommendations'+q)]);if(!riskResponse.ok||!recsResponse.ok)throw Error('Health services are temporarily unavailable.');const [risk,guidance]=await Promise.all([riskResponse.json(),recsResponse.json()]);if(city!==active)return;const current=risk.current||{},context=guidance.risk_context||{};summary.innerHTML=`<article><span>Mortality risk index</span><strong>${current.mortalityRiskIndex??'—'}/100</strong></article><article><span>Relative risk</span><strong>${current.relativeRisk??'—'}</strong></article><article class="health-level"><span>Overall heat-health level</span><strong>${esc(context.overall_heat_health_level||current.riskCategory||'Unavailable')}</strong></article>`;const items=(guidance.recommendations||[]).slice(0,3);recs.innerHTML=items.length?items.map(item=>`<article class="recommendation"><strong>${esc(item.category||'Heat-health action')}</strong><p>${esc(item.recommendation||item.action||'')}</p><small>${esc(item.reason||item.source||'Evidence-guided recommendation')}</small></article>`).join(''):'<p class="empty">No recommendations are available for this location.</p>';}catch(error){if(city!==active)return;summary.innerHTML='<article class="health-level"><span>Health risk</span><strong>Unavailable</strong></article>';recs.innerHTML='<p class="empty">Recommendations are temporarily unavailable.</p>';}}new MutationObserver(loadHealth).observe(place,{childList:true,characterData:true,subtree:true}); })();
</script></body></html>
