<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeatWatch | India WBGT</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="styles.css?v=4"><style>
.health-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:12px}.health-summary article{padding:8px;border:1px solid #d8e4e8;border-radius:6px;background:#f4f8f9}.health-summary strong,.health-summary span{display:block}.health-summary strong{font-size:1rem;color:#173e50}.health-summary span{font-size:.66rem;line-height:1.25;color:#56717e;text-transform:uppercase;letter-spacing:.05em;font-weight:750}.health-summary .health-level{grid-column:span 2;background:#edf7ee}.health-summary .health-level strong{font-size:.8rem}.recommendation-section{margin-top:14px}.recommendations{display:grid;gap:6px}.recommendation{padding:9px;border-left:3px solid #f58b2a;border-radius:4px;background:#f7fafb}.recommendation strong{display:block;font-size:.71rem;color:#284f60;margin-bottom:3px}.recommendation p{font-size:.76rem;line-height:1.35;margin:0;color:#294552}.recommendation small{display:block;margin-top:4px;color:#617983;font-size:.65rem}.recommendations .empty{font-size:.76rem;color:#56717e}.details-panel{display:block}.details-panel .close{display:none}
</style></head>
<body><header><div><p class="eyebrow">EXTREME HEAT EARLY WARNING</p><h1>India WBGT &amp; Heat-Health Dashboard</h1></div><p id="updated">Preparing live analysis&hellip;</p></header>
<main><section class="map-panel"><div id="map"></div><div class="map-ui"><label for="citySearch">Find a city</label><input id="citySearch" autocomplete="off" placeholder="Mumbai, Delhi, Bengaluru&hellip;"><div id="searchResults"></div></div>
<div class="map-legend"><strong>WBGT (&deg;C)</strong><div class="gradient"></div><div class="scale"><span>24</span><span>27.8</span><span>29.5</span><span>31.1</span><span>32.2+</span></div><div class="risk-labels"><span>LOW</span><span>MODERATE</span><span>HIGH</span><span>VERY HIGH</span><span>EXTREME</span></div></div><p id="fieldStatus" class="map-help">Loading calculated WBGT field&hellip;</p>
<aside id="details" class="details-panel visible" aria-label="Selected city heat-health dashboard"><p class="eyebrow" id="place">SELECT A CITY</p><div id="current" class="current-card"><p>Loading&hellip;</p></div><section class="health-summary" id="healthSummary" aria-live="polite"></section><h2>5-day peak forecast</h2><div id="forecast" class="forecast"></div><section class="recommendation-section"><h2>Recommended actions</h2><div id="recommendations" class="recommendations"></div></section></aside></section></main>
<template id="forecastRow"><article class="forecast-row"><time></time><strong></strong><span></span></article></template><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="health-panel.js?v=1"></script><script src="app.js?v=4"></script><script>
(() => { const place=document.getElementById('place'), summary=document.getElementById('healthSummary'), recs=document.getElementById('recommendations'); let active=''; const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); async function loadHealth(){const city=place.textContent.split(String.fromCharCode(0xC2,0xB7))[0].trim();if(!city||city==='SELECT A CITY'||city.includes('UPDATING')||city===active)return;active=city;summary.innerHTML='<article><span>Health risk</span><strong>Loading&hellip;</strong></article>';recs.innerHTML='<p class="empty">Loading recommended actions&hellip;</p>';try{const q='?city='+encodeURIComponent(city);const [riskResponse,recsResponse]=await Promise.all([fetch('/api/heat-risk'+q),fetch('/api/recommendations'+q)]);if(!riskResponse.ok||!recsResponse.ok)throw Error('Health services are temporarily unavailable.');const [risk,guidance]=await Promise.all([riskResponse.json(),recsResponse.json()]);if(city!==active)return;const current=risk.current||{},context=guidance.risk_context||{};summary.innerHTML=`<article><span>Mortality risk index</span><strong>${current.mortalityRiskIndex??'ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â'}/100</strong></article><article><span>Relative risk</span><strong>${current.relativeRisk??'ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â'}</strong></article><article class="health-level"><span>Overall heat-health level</span><strong>${esc(context.overall_heat_health_level||current.riskCategory||'Unavailable')}</strong></article>`;const items=(guidance.recommendations||[]).slice(0,3);recs.innerHTML=items.length?items.map(item=>`<article class="recommendation"><strong>${esc(item.category||'Heat-health action')}</strong><p>${esc(item.recommendation||item.action||'')}</p><small>${esc(item.reason||item.source||'Evidence-guided recommendation')}</small></article>`).join(''):'<p class="empty">No recommendations are available for this location.</p>';}catch(error){if(city!==active)return;summary.innerHTML='<article class="health-level"><span>Health risk</span><strong>Unavailable</strong></article>';recs.innerHTML='<p class="empty">Recommendations are temporarily unavailable.</p>';}}new MutationObserver(loadHealth).observe(place,{childList:true,characterData:true,subtree:true}); })();
</script></body></html>
